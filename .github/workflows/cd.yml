name: CD

# Continuous Delivery: builds and publishes container images to GitHub Container
# Registry (ghcr.io) on release tags or manual dispatch, and prepares deployment artifacts.

"on":
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Target deployment environment"
        required: true
        type: choice
        default: "staging"
        options:
          - staging
          - production
      publish_images:
        description: "Build and publish container images to GHCR"
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.8.2"

jobs:
  plan:
    name: Discover Images
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.plan.outputs.images }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Resolve Release Tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${{ github.event.inputs.target_environment }}-${GITHUB_SHA::7}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: List images from registry
        id: plan
        run: |
          echo "images=$(python scripts/ci/build_images.py --list-json --all | python -c "import json,sys;print(json.dumps([i['name'] for i in json.load(sys.stdin)]))")" >> "$GITHUB_OUTPUT"

  publish:
    name: Build & Push (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: [plan]
    if: github.event_name == 'push' || github.event.inputs.publish_images == 'true'
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.images) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('requirements-dev.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies from the hashed lock
        run: |
          python -m pip install "uv==${UV_VERSION}"
          uv pip sync --system --require-hashes requirements-dev.lock

      - name: Build local image with module probe
        run: |
          python scripts/ci/build_images.py --image "${{ matrix.image }}" --tag "${{ needs.plan.outputs.tag }}" --probe

      - name: Tag and push to GHCR
        run: |
          IMAGE_NAME="solace/${{ matrix.image }}:${{ needs.plan.outputs.tag }}"
          GHCR_REPO="${{ env.REGISTRY }}/${{ github.repository_owner }}/solace-${{ matrix.image }}"
          GHCR_REPO=$(echo "$GHCR_REPO" | tr '[:upper:]' '[:lower:]')

          docker tag "$IMAGE_NAME" "$GHCR_REPO:${{ needs.plan.outputs.tag }}"
          docker tag "$IMAGE_NAME" "$GHCR_REPO:${{ github.sha }}"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            docker tag "$IMAGE_NAME" "$GHCR_REPO:latest"
          fi

          docker push "$GHCR_REPO:${{ needs.plan.outputs.tag }}"
          docker push "$GHCR_REPO:${{ github.sha }}"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            docker push "$GHCR_REPO:latest"
          fi

  deployment-manifest:
    name: Prepare Deployment Manifest
    runs-on: ubuntu-latest
    needs: [plan, publish]
    if: always() && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    steps:
      - uses: actions/checkout@v4

      - name: Generate Deployment Summary
        run: |
          echo "### 🚀 CD Deployment Manifest" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Tag**: \`${{ needs.plan.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Images Built & Tagged**: Available in GHCR under \`${{ env.REGISTRY }}/${{ github.repository_owner }}/solace-*\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Strict Overlay**: Verified against \`docker-compose.prod.yml\`" >> $GITHUB_STEP_SUMMARY
