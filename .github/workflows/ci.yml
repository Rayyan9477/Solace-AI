name: CI

# CI mirrors the local runner (make ci-local): the suite and image lists come from
# scripts/ci/run_suites.py and scripts/ci/build_images.py, so nothing is hand-listed
# or ignored here. Test jobs do not wait for lint; every job reports independently.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.8.2"
  ENVIRONMENT: test
  KAFKA_ENABLED: "false"
  LOG_LEVEL: WARNING

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      suites: ${{ steps.plan.outputs.suites }}
      images: ${{ steps.plan.outputs.images }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: List suites and images from the registries
        id: plan
        run: |
          echo "suites=$(python scripts/ci/run_suites.py --list-json)" >> "$GITHUB_OUTPUT"
          echo "images=$(python scripts/ci/build_images.py --list-json --all | python -c "import json,sys;print(json.dumps([i['name'] for i in json.load(sys.stdin)]))")" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies from the hashed lock
        run: |
          python -m pip install "uv==${UV_VERSION}"
          uv pip sync --system --require-hashes requirements-dev.lock

      - name: Run ruff (syntax and critical errors, hard gate)
        run: ruff check . --select E9,F63,F7,F82 --no-fix --no-cache

  unit:
    name: Unit (${{ matrix.suite }})
    runs-on: ubuntu-latest
    needs: [plan]
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.plan.outputs.suites) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies from the hashed lock
        run: |
          python -m pip install "uv==${UV_VERSION}"
          uv pip sync --system --require-hashes requirements-dev.lock

      - name: Generate throwaway test secrets
        run: |
          python -c "import base64,os,secrets;e=lambda k,v:open(os.environ['GITHUB_ENV'],'a').write(k+'='+v+'\n');long=lambda:secrets.token_urlsafe(48);fern=lambda:base64.urlsafe_b64encode(secrets.token_bytes(32)).decode();[e(k,long()) for k in ('AUTH_SECRET_KEY','SECURITY_JWT_SECRET','USER_SERVICE_JWT_SECRET_KEY','SERVICE_AUTH_SERVICE_SECRET','POSTGRES_PASSWORD','USER_DB_PASSWORD')];[e(k,secrets.token_urlsafe(24)) for k in ('ENCRYPTION_MASTER_KEY','USER_SERVICE_FIELD_ENCRYPTION_KEY')];[e(k,fern()) for k in ('FERNET_TOKEN_KEY','FERNET_FIELD_KEY')]"

      - name: Run suite
        run: python scripts/ci/run_suites.py --tier unit --suite "${{ matrix.suite }}"

  realinfra:
    name: Real infrastructure
    runs-on: ubuntu-latest
    needs: [plan]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies from the hashed lock
        run: |
          python -m pip install "uv==${UV_VERSION}"
          uv pip sync --system --require-hashes requirements-dev.lock

      - name: Generate throwaway test secrets
        run: |
          python -c "import os,secrets;e=lambda k,v:open(os.environ['GITHUB_ENV'],'a').write(k+'='+v+'\n');[e(k,secrets.token_urlsafe(48)) for k in ('POSTGRES_PASSWORD','USER_DB_PASSWORD','SECURITY_JWT_SECRET')]"

      - name: Run real-infrastructure suites
        run: python scripts/ci/run_suites.py --tier realinfra --require-realinfra

  images:
    name: Image (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: [plan]
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.images) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies from the hashed lock
        run: |
          python -m pip install "uv==${UV_VERSION}"
          uv pip sync --system --require-hashes requirements-dev.lock

      - name: Build from the repo root and probe
        run: python scripts/ci/build_images.py --image "${{ matrix.image }}" --tag ci --probe

  # On-demand and nightly end-to-end run (WS-05); not part of push or pull_request.
  e2e:
    name: E2E (${{ matrix.profile }})
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    needs: [plan]
    strategy:
      fail-fast: false
      matrix:
        profile: [dev, strict]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies from the hashed lock
        run: |
          python -m pip install "uv==${UV_VERSION}"
          uv pip sync --system --require-hashes requirements-dev.lock

      - name: Generate throwaway test secrets
        run: |
          python -c "import os,secrets;e=lambda k,v:open(os.environ['GITHUB_ENV'],'a').write(k+'='+v+'\n');[e(k,secrets.token_urlsafe(48)) for k in ('POSTGRES_PASSWORD','USER_DB_PASSWORD','SECURITY_JWT_SECRET','AUTH_SECRET_KEY')]"

      - name: Run e2e suites
        run: python scripts/ci/run_suites.py --tier e2e --profile ${{ matrix.profile }}
