AWSTemplateFormatVersion: "2010-09-09"

Description: >
  Solace-AI ephemeral staging host. A single EC2 instance (Amazon Linux 2023) with
  Docker + Compose v2 for running the project docker-compose stack, reached via SSM
  Session Manager (no inbound ports, no SSH key). Scoped to solace-staging-* resource
  names so it matches the least-privilege deployer policy in
  infrastructure/aws-staging/solace-staging-deployer-policy.json. Synthetic data only.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Compute }
        Parameters: [InstanceType, VolumeSizeGb, LatestAmiId, DockerComposeVersion]
      - Label: { default: Network (default VPC) }
        Parameters: [VpcId, SubnetId]
    ParameterLabels:
      SubnetId: { default: A public subnet in the chosen VPC }

Parameters:
  InstanceType:
    Type: String
    Default: m5.xlarge
    AllowedValues: [m5.large, m5.xlarge, m5.2xlarge, t3.xlarge, t3.2xlarge]
    Description: >
      EC2 size. The full stack (postgres, redis, kafka, weaviate, 10 services) wants
      ~8 GB free RAM; m5.xlarge (16 GB) is comfortable. m5.large (8 GB) is tight.

  VolumeSizeGb:
    Type: Number
    Default: 60
    MinValue: 40
    MaxValue: 200
    Description: Root gp3 EBS size in GB (image layers + build cache need headroom).

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Latest Amazon Linux 2023 x86_64 AMI (resolved from the public SSM parameter).

  DockerComposeVersion:
    Type: String
    Default: v2.29.7
    Description: Docker Compose v2 plugin release tag to install.

  VpcId:
    Type: AWS::EC2::VPC::Id
    Default: vpc-07664ce966d106387
    Description: VPC for the staging host (defaults to the account default VPC in us-east-1).

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: >
      A PUBLIC subnet in the chosen VPC (auto-assigns a public IP so the SSM agent can
      reach the SSM endpoints outbound). List them with:
      aws ec2 describe-subnets --filters "Name=vpc-id,Values=<VpcId>"
      "Name=map-public-ip-on-launch,Values=true" --query "Subnets[].SubnetId"

Resources:
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: solace-staging-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - { Key: Project, Value: solace-staging }

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: solace-staging-instance-profile
      Roles:
        - !Ref InstanceRole

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: solace-staging egress-only (SSM Session Manager access, no inbound)
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound (base images, Python wheels, SSM endpoints)
      Tags:
        - { Key: Name, Value: solace-staging-sg }
        - { Key: Project, Value: solace-staging }

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestAmiId
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref SecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: !Ref VolumeSizeGb
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - { Key: Name, Value: solace-staging }
        - { Key: Project, Value: solace-staging }
      UserData:
        Fn::Base64:
          Fn::Sub: |
            #!/bin/bash
            set -euxo pipefail
            dnf update -y
            dnf install -y docker git python3 python3-pip
            systemctl enable --now docker
            usermod -aG docker ec2-user || true
            mkdir -p /usr/local/lib/docker/cli-plugins
            curl -SL "https://github.com/docker/compose/releases/download/${DockerComposeVersion}/docker-compose-linux-x86_64" \
              -o /usr/local/lib/docker/cli-plugins/docker-compose
            chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
            docker --version || true
            docker compose version || true
            cat >/etc/motd <<'MOTD'
            ============================================================
             Solace-AI STAGING host (ephemeral). SYNTHETIC DATA ONLY.
             No live/real PHI until the HIPAA BAA is signed.
             Next steps -- see infrastructure/aws-staging/DEPLOY.md:
               1) Put the repo here (git clone with a token, or scp/S3).
               2) Create .env.prod  (docs/STAGING-BRINGUP.md section 1).
               3) docker compose --env-file .env.prod \
                    -f docker-compose.yml -f docker-compose.prod.yml up -d --build
               4) alembic upgrade head ; then the health checks (section 5).
            ============================================================
            MOTD
            touch /opt/solace-staging-ready

Outputs:
  InstanceId:
    Description: EC2 instance id of the staging host.
    Value: !Ref Instance
  SsmSessionCommand:
    Description: Open a keyless shell on the host (requires the AmazonSSMFullAccess grant).
    Value: !Sub "aws ssm start-session --target ${Instance} --region ${AWS::Region}"
  SecurityGroupId:
    Value: !Ref SecurityGroup
  InstanceProfileName:
    Value: !Ref InstanceProfile
  Region:
    Value: !Ref AWS::Region
