# Solace-AI Prometheus configuration (MVP-036).
#
# One job, solace-services, scrapes the nine MVP services on their real ports. Each target
# carries a `service` label equal to the service_name of that service's ServiceRuntimeSpec,
# which is also the `service` label on its solace_* metrics. Alert rules (WS-04.7) select on
# job="solace-services" and `service`.
#
# Not scraped:
# - config-service is not an MVP service (decision D-19);
# - Postgres, Redis and Kafka expose no Prometheus endpoint, so they get a job only together
#   with an exporter.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: solace-services
    metrics_path: /metrics
    static_configs:
      - targets: ["orchestrator-service:8000"]
        labels:
          service: orchestrator-service
      - targets: ["user-service:8001"]
        labels:
          service: user-service
      - targets: ["safety-service:8002"]
        labels:
          service: safety-service
      - targets: ["notification-service:8003"]
        labels:
          service: notification-service
      - targets: ["diagnosis-service:8004"]
        labels:
          service: diagnosis-service
      - targets: ["memory-service:8005"]
        labels:
          service: memory-service
      - targets: ["therapy-service:8006"]
        labels:
          service: therapy-service
      - targets: ["personality-service:8007"]
        labels:
          service: personality-service
      - targets: ["analytics-service:8009"]
        labels:
          service: analytics-service
