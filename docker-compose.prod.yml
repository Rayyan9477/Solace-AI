# Solace-AI production override (Sprint 8).
#
# Applied on top of the base ``docker-compose.yml``:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Adds:
#   - Caddy as the TLS-terminating reverse proxy (the only container with
#     exposed ports 80 / 443).
#   - Restart policies so services come back after host reboot.
#   - Log rotation (json-file driver, 10 MB x 3) to avoid runaway disk use.
#   - Resource limits to prevent any one service from starving the VPS.
#   - Closes the public ports on internal services — Caddy reaches them
#     via the shared docker network, but the host no longer exposes them.
#
# Required env (via ``.env.prod`` on the VPS):
#   DOMAIN               primary domain (e.g. solace-demo.example)
#   CADDY_ADMIN_EMAIL    letsencrypt contact
#   BASIC_AUTH_HASH      bcrypt hash for Grafana/Jaeger (use `caddy hash-password`)
#   POSTGRES_PASSWORD    overrides the dev default
#   ENCRYPTION_MASTER_KEY 32-byte key from secrets.token_bytes(32).hex()
#   ENCRYPTION_SEARCH_HASH_SALT  32+ byte salt
#   AUTH_SECRET_KEY      32+ byte JWT signing key
#   GOOGLE_OAUTH_CLIENT_ID, GOOGLE_OAUTH_CLIENT_SECRET
#   PORTKEY_API_KEY      https://portkey.ai dashboard
#   ENVIRONMENT=production

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-restart: &default-restart
  restart: unless-stopped

services:
  caddy:
    image: caddy:2.8-alpine
    container_name: solace-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    env_file: .env.prod
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - frontend
      - backend
      - monitoring
    depends_on:
      - orchestrator-service
      - user-service
    logging: *default-logging
    <<: *default-restart
    deploy:
      resources:
        limits:
          memory: 256M

  # ---- App services: close host ports, add restart + log rotation ----
  orchestrator-service:
    ports: []  # Only reachable via Caddy
    env_file: .env.prod
    logging: *default-logging
    <<: *default-restart
    deploy:
      resources:
        limits:
          memory: 768M

  user-service:
    ports: []
    env_file: .env.prod
    logging: *default-logging
    <<: *default-restart
    deploy:
      resources:
        limits:
          memory: 512M

  safety-service:
    ports: []
    env_file: .env.prod
    logging: *default-logging
    <<: *default-restart
    deploy:
      resources:
        limits:
          memory: 512M

  diagnosis-service:
    ports: []
    env_file: .env.prod
    logging: *default-logging
    <<: *default-restart
    deploy:
      resources:
        limits:
          memory: 768M

  therapy-service:
    ports: []
    env_file: .env.prod
    logging: *default-logging
    <<: *default-restart
    deploy:
      resources:
        limits:
          memory: 768M

  memory-service:
    ports: []
    env_file: .env.prod
    logging: *default-logging
    <<: *default-restart
    deploy:
      resources:
        limits:
          memory: 768M

  personality-service:
    ports: []
    env_file: .env.prod
    logging: *default-logging
    <<: *default-restart
    deploy:
      resources:
        # RoBERTa model inflates memory footprint
        limits:
          memory: 1.5G

  notification-service:
    ports: []
    env_file: .env.prod
    logging: *default-logging
    <<: *default-restart

  analytics-service:
    ports: []
    env_file: .env.prod
    logging: *default-logging
    <<: *default-restart

  config-service:
    ports: []
    env_file: .env.prod
    logging: *default-logging
    <<: *default-restart

  # ---- Infra services: keep internal-only (no host port publication) ----
  postgres:
    ports: []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    logging: *default-logging
    <<: *default-restart
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    ports: []
    logging: *default-logging
    <<: *default-restart
    deploy:
      resources:
        limits:
          memory: 512M

  weaviate:
    ports: []
    logging: *default-logging
    <<: *default-restart
    deploy:
      resources:
        limits:
          memory: 1G

  kafka:
    ports: []
    logging: *default-logging
    <<: *default-restart
    deploy:
      resources:
        limits:
          memory: 768M

  zookeeper:
    ports: []
    logging: *default-logging
    <<: *default-restart

  # ---- Observability: only reachable via Caddy's basic-auth frontend ----
  grafana:
    ports: []
    logging: *default-logging
    <<: *default-restart

  jaeger:
    ports: []
    logging: *default-logging
    <<: *default-restart

  prometheus:
    ports: []
    logging: *default-logging
    <<: *default-restart

volumes:
  caddy_data:
  caddy_config:

networks:
  frontend:
    driver: bridge
