# Solace-AI Docker Compose Configuration
# Local development environment with all infrastructure components
#
# Usage:
#   docker compose up -d                    # Start all services (postgres, the migrate job, then the apps)
#   docker compose up -d postgres redis     # Start only infrastructure
#   docker compose run --rm migrate         # Apply the migrations by hand
#   docker compose logs -f kafka            # View Kafka logs
#   docker compose down -v                  # Stop and remove volumes
#
# Environment variables should be set in a .env file (see .env.example)
#
# Every app-service variable (and the postgres, weaviate and Caddy secrets) is registered in
# deploy/env/env-contract.yaml (IF-02); .env.example is rendered from it and
# tests/deploy/test_env_contract.py renders this file to enforce it.
# Every service gate (*_ENVIRONMENT, *_SERVICE_ENV) is always ${ENVIRONMENT}, never a literal.
# No service sets container_name, so containers are scoped by the compose project.
#
# Data plane (IF-02, IF-03, D-02): one database, solace. On an empty data directory init-db
# (infrastructure/init-db/01-roles.sh) creates the two platform roles: solace_app, the only role the
# app services connect as (POSTGRES_PASSWORD), and solace_migrator, the migrate job's role
# (POSTGRES_MIGRATOR_PASSWORD). The image superuser postgres (POSTGRES_SUPERUSER_PASSWORD) is for
# init, ops and backups only. App services start only after the migrate job has exited 0. A
# postgres_data volume created before the platform roles existed never turns healthy: recreate it
# with `docker compose down -v`.
#
# Every built service (the nine app services and migrate) is tagged solace/<service>:<tag>, the
# reference WS-01's image builder uses (scripts/ci/build_images.py image_ref); SOLACE_IMAGE_TAG is a
# compose interpolation variable only (default dev). Each has pull_policy build, so Compose never
# asks a registry for that unqualified reference.
#
# Exposure (MVP-040): every published dev port binds 127.0.0.1 only. Redis always requires
# REDIS_PASSWORD (MVP-118), and every client gets it from that one source.

# Shared by the nine app services (IF-02 environment, auth, PHI and audit).
x-app-environment: &app-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-dev-jwt-secret-key-minimum-32-chars}
  AUTH_ALGORITHM: ${AUTH_ALGORITHM:-HS256}
  AUTH_PUBLIC_KEYS_JSON: ${AUTH_PUBLIC_KEYS_JSON:-}
  AUTH_ACTIVE_KID: ${AUTH_ACTIVE_KID:-}
  AUTH_ACCEPT_LEGACY_HS256: ${AUTH_ACCEPT_LEGACY_HS256:-true}
  ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:-}
  ENCRYPTION_SEARCH_HASH_SALT: ${ENCRYPTION_SEARCH_HASH_SALT:-}
  ENCRYPTION_KEY_ID: ${ENCRYPTION_KEY_ID:-k1}
  ENCRYPTION_RETIRED_KEYS_JSON: ${ENCRYPTION_RETIRED_KEYS_JSON:-}
  AUDIT_HMAC_KEY: ${AUDIT_HMAC_KEY:-}

# The Redis values every client gets (MVP-118). One REDIS_PASSWORD source reaches the server and
# every client, so a rotation cannot leave one behind; it must be URL-safe, because REDIS_URL carries
# it. The legacy *_REDIS_HOST/PORT/PASSWORD names below are aliases of these anchors.
x-redis-values:
  host: &redis-host redis
  port: &redis-port "6379"
  password: &redis-password ${REDIS_PASSWORD:-solace_redis_dev_only}

# Shared by the nine app services: the IF-02 data plane (Postgres as solace_app, Redis, Kafka and the
# seven peers). Each value is anchored here once and every legacy alias below is an alias of its
# anchor, so an alias can never diverge from the IF-02 name it stands for.
x-data-plane-environment: &data-plane-env
  POSTGRES_HOST: &pg-host postgres
  POSTGRES_PORT: &pg-port "5432"
  POSTGRES_DATABASE: &pg-database solace
  POSTGRES_USER: &pg-app-user solace_app
  # solace_app's password; URL-safe, because SAFETY_REPO_POSTGRES_DSN carries it too.
  POSTGRES_PASSWORD: &pg-app-password ${POSTGRES_PASSWORD:-solace_app_dev_only}
  POSTGRES_SSL_MODE: ${POSTGRES_SSL_MODE:-prefer}
  POSTGRES_MIN_POOL_SIZE: "1"
  POSTGRES_MAX_POOL_SIZE: "8"
  # IF-02: the runtime has no localhost fallback for Redis, and the server always requires the password.
  REDIS_URL: &redis-url redis://:${REDIS_PASSWORD:-solace_redis_dev_only}@redis:6379/0
  KAFKA_BOOTSTRAP_SERVERS: &kafka-bootstrap kafka:9092
  # false is allowed only in development/test; replaces the per-service Kafka flags in W1 (IF-02).
  EVENTS_ENABLED: "true"
  SERVICE_SAFETY_SERVICE_URL: &safety-url http://safety-service:8002
  SERVICE_NOTIFICATION_SERVICE_URL: &notification-url http://notification-service:8003
  SERVICE_DIAGNOSIS_SERVICE_URL: &diagnosis-url http://diagnosis-service:8004
  SERVICE_MEMORY_SERVICE_URL: &memory-url http://memory-service:8005
  SERVICE_THERAPY_SERVICE_URL: &therapy-url http://therapy-service:8006
  SERVICE_PERSONALITY_SERVICE_URL: &personality-url http://personality-service:8007
  SERVICE_USER_SERVICE_URL: &user-url http://user-service:8001

# Every app service waits for the schema (the migrate job exited 0) and for Kafka.
x-app-depends-on: &app-depends-on
  migrate:
    condition: service_completed_successfully
  kafka:
    condition: service_healthy

# Every app service: restart, and a stop grace sized for the runtime's ordered shutdown (WS-04.4).
# On SIGTERM uvicorn first drains in-flight requests (an orchestrator turn is bounded by
# ORCHESTRATOR_TURN_TIMEOUT_SECONDS=20), then the runtime runs its closers last-registered first, each
# bounded by SHUTDOWN_STEP_TIMEOUT_SECONDS=5 (W0 registers three: readiness refresher, redis, postgres;
# W1 adds the event plane). Budget six closers: 20 s + 6 x 5 s = 50 s, so Docker waits 60 s before
# it sends SIGKILL.
# pull_policy build: solace/<service>:<tag> is an unqualified (Docker Hub) reference, so a service that
# builds its image never asks a registry for it (controller ruling, WS-03.3).
x-app-service: &app-service
  restart: unless-stopped
  stop_grace_period: 60s
  pull_policy: build

# IF-18: app healthchecks probe /live (liveness only; /ready gates traffic, not restarts).
x-live-healthcheck: &live-healthcheck
  interval: 15s
  timeout: 5s
  retries: 3
  start_period: 60s

# Shared by the five LLM services (orchestrator, safety, therapy, diagnosis, personality; D-04).
x-llm-environment: &llm-env
  LLM_PORTKEY_API_KEY: ${LLM_PORTKEY_API_KEY:-}
  LLM_PORTKEY_GATEWAY_URL: ${LLM_PORTKEY_GATEWAY_URL:-https://api.portkey.ai/v1}
  LLM_ANTHROPIC_API_KEY: ${LLM_ANTHROPIC_API_KEY:-}
  LLM_ENABLE_CACHING: "false"
  LLM_TIMEOUT_SECONDS: "30"
  LLM_PHI_EGRESS_APPROVED: ${LLM_PHI_EGRESS_APPROVED:-false}

services:
  # =============================================================================
  # INFRASTRUCTURE SERVICES
  # =============================================================================

  postgres:
    image: postgres:16-alpine
    environment:
      # The image superuser (init, ops and backups only; D-02) and the one application database.
      # init-db creates solace_app and solace_migrator with these two passwords and fails closed
      # without them (infrastructure/init-db/01-roles.sh).
      POSTGRES_USER: postgres
      POSTGRES_DB: solace
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-solace_superuser_dev_only}
      SOLACE_APP_PASSWORD: *pg-app-password
      SOLACE_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:-solace_migrator_dev_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Healthy only when the server accepts TCP AND both platform roles exist. The entrypoint's
      # temporary init server listens on the unix socket only, so the TCP probe keeps the check from
      # passing before the real server is up (pg_isready needs no password, so it also works under
      # the strict hostssl-only hba). A first init that fails part-way leaves a data directory, so
      # init-db never runs again; pg_isready alone would then report the role-less server healthy.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d solace && psql -X -U postgres -d solace -tAc \"select 1/(count(*)=2)::int from pg_roles where rolname in ('solace_app','solace_migrator')\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - data

  # One-shot schema job (IF-03): python -m scripts.db.migrate upgrade head as solace_migrator, under
  # the migration advisory lock; it refuses any other login. DATABASE_URL carries no query string or
  # fragment: TLS comes only from POSTGRES_SSL_MODE and POSTGRES_SSL_ROOT_CERT (WS-02.4, WS-02.5).
  # The image puts the repository root and src/ on PYTHONPATH (docker/migrate.Dockerfile).
  migrate:
    build:
      context: .
      dockerfile: docker/migrate.Dockerfile
    image: solace/migrate:${SOLACE_IMAGE_TAG:-dev}
    pull_policy: build
    command: ["python", "-m", "scripts.db.migrate", "upgrade", "head"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+asyncpg://solace_migrator:${POSTGRES_MIGRATOR_PASSWORD:-solace_migrator_dev_only}@postgres:5432/solace
      POSTGRES_SSL_MODE: ${POSTGRES_SSL_MODE:-prefer}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - data

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: *redis-password
    # requirepass is always on and the password never reaches argv: the shell writes it into a
    # private config file, then hands redis-server to the image's entrypoint, which drops root and
    # runs it as the redis user (a bare `exec redis-server` here would keep it running as root).
    # It first refuses a password that is not URL-safe, without echoing it: redis-server would print
    # a bad requirepass line (password included) and a '/' or '+' breaks every client's REDIS_URL.
    command: ["sh", "-c", "case \"$$REDIS_PASSWORD\" in ''|*[!A-Za-z0-9_-]*) echo 'REDIS_PASSWORD must be URL-safe [A-Za-z0-9_-]' >&2; exit 1;; esac; umask 077; printf 'appendonly yes\\nrequirepass %s\\n' \"$$REDIS_PASSWORD\" > /tmp/redis.conf && chown redis:redis /tmp/redis.conf && exec docker-entrypoint.sh redis-server /tmp/redis.conf"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      # healthy only when the server answers PONG to the configured password (NOAUTH or WRONGPASS fail)
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      # MVP-045: an explicit heap inside the strict 512m limit (the image default is larger).
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx256m"
    ports:
      - "127.0.0.1:2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - data

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # MVP-045: without it the broker starts with -Xmx1G, more than its strict limit; 512m heap plus
      # JVM overhead fits the strict 1g limit.
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    ports:
      - "127.0.0.1:29092:29092"
      # 9092 is the internal broker port — only expose to host if external clients need it.
      # Services on solace-network reach Kafka via kafka:9092 without host port mapping.
      # - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      # The probe is a JVM too: it sets its own small heap inline so it never inherits the broker's
      # KAFKA_HEAP_OPTS (two 512m JVMs would not fit the limit).
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS='-Xms32m -Xmx96m' kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - data

  weaviate:
    # REV-11: 1.22.4 predates the gRPC API that weaviate-client 4.10 requires. Bumped to
    # a 1.26.x server (gRPC on :50051) and the gRPC port is now exposed.
    # D-04: opt-in (docker compose --profile vector ...). Weaviate writes are off by default
    # (WEAVIATE_ENABLED=false) and retrieval stays keyword/BM25, so nothing on the chat path waits for it.
    image: semitechnologies/weaviate:1.26.1
    profiles: ["vector"]
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      # SECURITY: Anonymous access disabled. Use API key authentication.
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "false"
      AUTHENTICATION_APIKEY_ENABLED: "true"
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: "${WEAVIATE_API_KEY:-solace-dev-key-change-in-production}"
      AUTHENTICATION_APIKEY_USERS: "solace-admin"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: "node1"
      GRPC_PORT: "50051"
    ports:
      - "127.0.0.1:${WEAVIATE_PORT:-8080}:8080"
      - "127.0.0.1:${WEAVIATE_GRPC_PORT:-50051}:50051"   # gRPC (weaviate-client v4)
    volumes:
      - weaviate_data:/var/lib/weaviate
    healthcheck:
      # MVP-002: the image has wget but no curl, so a curl check never passed
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/v1/.well-known/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    networks:
      - data

  # =============================================================================
  # OBSERVABILITY STACK
  # =============================================================================

  jaeger:
    image: jaegertracing/all-in-one:1.51
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"   # Jaeger UI
      - "127.0.0.1:4317:4317"     # OTLP gRPC
      - "127.0.0.1:4318:4318"     # OTLP HTTP
      - "127.0.0.1:6831:6831/udp" # Thrift compact
    restart: unless-stopped
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:v2.47.0
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
    networks:
      # REV-11: Prometheus must sit on the app networks to scrape the services'
      # /metrics endpoints (it was on `monitoring` only and scraped nothing).
      - monitoring
      - backend
      - data

  grafana:
    image: grafana/grafana:10.1.0
    environment:
      # MVP-040: no committed admin password; the strict overlay requires GRAFANA_ADMIN_PASSWORD.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - monitoring

  # =============================================================================
  # APPLICATION SERVICES
  # =============================================================================

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    image: solace/user-service:${SOLACE_IMAGE_TAG:-dev}
    environment:
      <<: [*app-env, *data-plane-env]
      USER_SERVICE_ENV: ${ENVIRONMENT:-development}
      USER_SERVICE_PORT: 8001
      USER_SERVICE_JWT_SECRET_KEY: ${AUTH_SECRET_KEY:-dev-jwt-secret-key-minimum-32-chars}
      USER_SERVICE_FIELD_ENCRYPTION_KEY: ${USER_SERVICE_FIELD_ENCRYPTION_KEY:-dev-encryption-key-32-characters}
      AUTH_PRIVATE_KEY_PEM: ${AUTH_PRIVATE_KEY_PEM:-}
      FERNET_TOKEN_KEY: "${FERNET_TOKEN_KEY:-8kTaL3nRf9xQpZmVwYdE7gHjKbNcSuW2A5iO0tP4rXs=}"
      FERNET_FIELD_KEY: "${FERNET_FIELD_KEY:-3mBvN7xRtYfW0pLqKjH8dS5gC2eA9iZuO6wTrXnMaQs=}"
      # legacy aliases (IF-02): the data-plane anchors until user-service stops reading them
      USER_DB_HOST: *pg-host
      USER_DB_PORT: *pg-port
      USER_DB_NAME: *pg-database
      USER_DB_USER: *pg-app-user
      USER_DB_PASSWORD: *pg-app-password
      USER_REDIS_HOST: *redis-host
      USER_REDIS_PORT: *redis-port
      USER_REDIS_PASSWORD: *redis-password
      USER_KAFKA_ENABLE: "true"
      USER_KAFKA_BOOTSTRAP_SERVERS: *kafka-bootstrap
      USER_SERVICE_THERAPY_SERVICE_URL: *therapy-url
      USER_SERVICE_NOTIFICATION_SERVICE_URL: *notification-url
      SECURITY_JWT_SECRET: ${AUTH_SECRET_KEY:-dev-jwt-secret-key-minimum-32-chars}
      # OAuth is off unless both the client id and secret are set (IF-02, IF-17).
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:8001/api/v1/auth/oauth/google/callback}
      GOOGLE_OAUTH_ISSUER: https://accounts.google.com
      GOOGLE_OAUTH_AUTHORIZE_URL: https://accounts.google.com/o/oauth2/v2/auth
      GOOGLE_OAUTH_TOKEN_URL: https://oauth2.googleapis.com/token
      GOOGLE_OAUTH_JWKS_URL: https://www.googleapis.com/oauth2/v3/certs
      OAUTH_ALLOWED_REDIRECT_ORIGINS: ${OAUTH_ALLOWED_REDIRECT_ORIGINS:-http://localhost:3000}
      # Edge (MVP-225): the browser origins CORS allows; no proxy hop is trusted in dev (the
      # strict overlay requires the origins and trusts exactly Caddy's one hop).
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      TRUSTED_PROXY_HOPS: "0"
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      <<: *app-depends-on
      redis:
        condition: service_healthy
    healthcheck:
      <<: *live-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/live', timeout=3)"]
    <<: *app-service
    networks:
      - backend
      - data

  safety-service:
    build:
      context: .
      dockerfile: services/safety_service/Dockerfile
    image: solace/safety-service:${SOLACE_IMAGE_TAG:-dev}
    environment:
      <<: [*app-env, *data-plane-env, *llm-env]
      SAFETY_ENVIRONMENT: ${ENVIRONMENT:-development}
      SAFETY_PORT: 8002
      SAFETY_REPO_STORAGE_BACKEND: postgres
      # legacy aliases (IF-02): the DSN is built from the same POSTGRES_PASSWORD source as solace_app's
      SAFETY_REPO_POSTGRES_DSN: postgresql+asyncpg://solace_app:${POSTGRES_PASSWORD:-solace_app_dev_only}@postgres:5432/solace
      SAFETY_REPO_REDIS_URL: *redis-url
      SAFETY_KAFKA_ENABLED: "true"
      SAFETY_KAFKA_BOOTSTRAP_SERVERS: *kafka-bootstrap
      SAFETY_EVENTS_KAFKA_BOOTSTRAP_SERVERS: *kafka-bootstrap
      ESCALATION_NOTIFICATION_SERVICE_URL: *notification-url
      CLINICIAN_REGISTRY_USER_SERVICE_URL: *user-url
    ports:
      - "127.0.0.1:8002:8002"
    depends_on:
      <<: *app-depends-on
      redis:
        condition: service_healthy
    healthcheck:
      <<: *live-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/live', timeout=3)"]
    <<: *app-service
    networks:
      - backend
      - data

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    image: solace/notification-service:${SOLACE_IMAGE_TAG:-dev}
    environment:
      <<: [*app-env, *data-plane-env]
      # P1-9: runtime gate is ServiceConfig(env_prefix="NOTIFICATION_SERVICE_").env, so the
      # binding var is NOTIFICATION_SERVICE_ENV; MVP-004: derived from ENVIRONMENT.
      NOTIFICATION_SERVICE_ENV: ${ENVIRONMENT:-development}
      NOTIFICATION_SERVICE_PORT: 8003
      EMAIL_ENABLED: "true"
      EMAIL_SMTP_HOST: ${SMTP_HOST:-mailhog}
      EMAIL_SMTP_PORT: ${SMTP_PORT:-1025}
      SMS_ENABLED: "false"
      PUSH_ENABLED: "false"
      # legacy aliases (IF-02)
      KAFKA_ENABLED: "true"
      NOTIFICATION_USER_SERVICE_URL: *user-url
    ports:
      - "127.0.0.1:8003:8003"
    # Notification consumes crisis events from Kafka. mailhog is a DEV-only SMTP sink
    # (dev profile); a real relay is set through the SMTP_HOST interpolation source.
    depends_on:
      <<: *app-depends-on
      # IF-01 SPEC uses_redis=True: the runtime pings REDIS_URL at startup
      redis:
        condition: service_healthy
    healthcheck:
      <<: *live-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/live', timeout=3)"]
    <<: *app-service
    networks:
      - backend
      - data

  diagnosis-service:
    build:
      context: .
      dockerfile: services/diagnosis_service/Dockerfile
    image: solace/diagnosis-service:${SOLACE_IMAGE_TAG:-dev}
    environment:
      <<: [*app-env, *data-plane-env, *llm-env]
      DIAGNOSIS_ENVIRONMENT: ${ENVIRONMENT:-development}
      DIAGNOSIS_PORT: 8004
      # legacy aliases (IF-02)
      DIAGNOSIS_DB_HOST: *pg-host
      DIAGNOSIS_DB_PORT: *pg-port
      DIAGNOSIS_DB_NAME: *pg-database
      DIAGNOSIS_DB_USER: *pg-app-user
      DIAGNOSIS_DB_PASSWORD: *pg-app-password
      DIAGNOSIS_REDIS_HOST: *redis-host
      DIAGNOSIS_REDIS_PORT: *redis-port
      DIAGNOSIS_REDIS_PASSWORD: *redis-password
      DIAGNOSIS_SESSION_REDIS_HOST: *redis-host
      DIAGNOSIS_SESSION_REDIS_PORT: *redis-port
      DIAGNOSIS_SESSION_REDIS_PASSWORD: *redis-password
    ports:
      - "127.0.0.1:8004:8004"
    depends_on:
      <<: *app-depends-on
      # DiagnosisSessionStore.initialize() pings Redis at startup
      redis:
        condition: service_healthy
    healthcheck:
      <<: *live-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/live', timeout=3)"]
    <<: *app-service
    networks:
      - backend
      - data

  memory-service:
    build:
      context: .
      dockerfile: services/memory_service/Dockerfile
    image: solace/memory-service:${SOLACE_IMAGE_TAG:-dev}
    environment:
      <<: [*app-env, *data-plane-env]
      # P1-9: the runtime gate is MemoryServiceAppSettings(env_prefix="MEMORY_").environment,
      # which binds MEMORY_ENVIRONMENT (MEMORY_SERVICE_ENV bound nothing); MVP-004: derived
      # from ENVIRONMENT so the production PHI guards are reachable.
      MEMORY_ENVIRONMENT: ${ENVIRONMENT:-development}
      MEMORY_SERVICE_PORT: 8005
      # legacy aliases (IF-02)
      MEMORY_DB_HOST: *pg-host
      MEMORY_DB_PORT: *pg-port
      MEMORY_DB_DATABASE: *pg-database
      MEMORY_DB_USER: *pg-app-user
      MEMORY_DB_PASSWORD: *pg-app-password
      MEMORY_REDIS_HOST: *redis-host
      MEMORY_REDIS_PORT: *redis-port
      MEMORY_REDIS_PASSWORD: *redis-password
      REDIS_HOST: *redis-host
      REDIS_PORT: *redis-port
      REDIS_PASSWORD: *redis-password
      # D-04: Weaviate is opt-in (profile vector); off, memory-service serves keyword/BM25 retrieval.
      WEAVIATE_ENABLED: ${WEAVIATE_ENABLED:-false}
      MEMORY_EMBEDDINGS_PROVIDER: none
      WEAVIATE_HOST: weaviate
      WEAVIATE_PORT: 8080
      WEAVIATE_GRPC_PORT: 50051
      WEAVIATE_API_KEY: ${WEAVIATE_API_KEY:-solace-dev-key-change-in-production}
      MEMORY_KAFKA_BOOTSTRAP_SERVERS: *kafka-bootstrap
    ports:
      - "127.0.0.1:8005:8005"
    # MVP-002: never waits for Weaviate (opt-in, and the service degrades without it).
    depends_on:
      <<: *app-depends-on
      redis:
        condition: service_healthy
    healthcheck:
      <<: *live-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/live', timeout=3)"]
    <<: *app-service
    networks:
      - backend
      - data

  therapy-service:
    build:
      context: .
      dockerfile: services/therapy_service/Dockerfile
    image: solace/therapy-service:${SOLACE_IMAGE_TAG:-dev}
    environment:
      <<: [*app-env, *data-plane-env, *llm-env]
      THERAPY_ENVIRONMENT: ${ENVIRONMENT:-development}
      THERAPY_PORT: 8006
      # legacy aliases (IF-02)
      THERAPY_DB_HOST: *pg-host
      THERAPY_DB_PORT: *pg-port
      THERAPY_DB_DATABASE: *pg-database
      THERAPY_DB_USER: *pg-app-user
      THERAPY_DB_PASSWORD: *pg-app-password
      THERAPY_REDIS_HOST: *redis-host
      THERAPY_REDIS_PORT: *redis-port
      THERAPY_REDIS_PASSWORD: *redis-password
      THERAPY_SESSION_REDIS_HOST: *redis-host
      THERAPY_SESSION_REDIS_PORT: *redis-port
      THERAPY_SESSION_REDIS_PASSWORD: *redis-password
      THERAPY_KAFKA_ENABLED: "true"
      THERAPY_KAFKA_BOOTSTRAP_SERVERS: *kafka-bootstrap
      THERAPY_CONTEXT_MEMORY_SERVICE_URL: *memory-url
    ports:
      - "127.0.0.1:8006:8006"
    depends_on:
      <<: *app-depends-on
      redis:
        condition: service_healthy
    healthcheck:
      <<: *live-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8006/live', timeout=3)"]
    <<: *app-service
    networks:
      - backend
      - data

  personality-service:
    build:
      context: .
      dockerfile: services/personality_service/Dockerfile
    image: solace/personality-service:${SOLACE_IMAGE_TAG:-dev}
    environment:
      <<: [*app-env, *data-plane-env, *llm-env]
      PERSONALITY_ENVIRONMENT: ${ENVIRONMENT:-development}
      PERSONALITY_PORT: 8007
      # legacy aliases (IF-02)
      PERSONALITY_DB_HOST: *pg-host
      PERSONALITY_DB_PORT: *pg-port
      PERSONALITY_DB_NAME: *pg-database
      PERSONALITY_DB_USER: *pg-app-user
      PERSONALITY_DB_PASSWORD: *pg-app-password
      PERSONALITY_REDIS_HOST: *redis-host
      PERSONALITY_REDIS_PORT: *redis-port
      PERSONALITY_REDIS_PASSWORD: *redis-password
    ports:
      - "127.0.0.1:8007:8007"
    depends_on:
      <<: *app-depends-on
      # IF-01 SPEC uses_redis=True: the runtime pings REDIS_URL at startup
      redis:
        condition: service_healthy
    healthcheck:
      <<: *live-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8007/live', timeout=3)"]
    <<: *app-service
    networks:
      - backend
      - data

  orchestrator-service:
    build:
      context: .
      dockerfile: services/orchestrator_service/Dockerfile
    image: solace/orchestrator-service:${SOLACE_IMAGE_TAG:-dev}
    environment:
      <<: [*app-env, *data-plane-env, *llm-env]
      ORCHESTRATOR_ENVIRONMENT: ${ENVIRONMENT:-development}
      ORCHESTRATOR_PORT: 8000
      # PYSEC-2026-83: langgraph's strict msgpack checkpoint decoding is opt-in (WS-01.F2).
      LANGGRAPH_STRICT_MSGPACK: "true"
      ORCHESTRATOR_TURN_TIMEOUT_SECONDS: "20"
      ORCHESTRATOR_AGENT_TIMEOUT_SECONDS: "8"
      ORCHESTRATOR_SAFETY_CHECK_TIMEOUT_SECONDS: "2"
      ORCHESTRATOR_WS_MAX_PER_USER: "3"
      # legacy aliases (IF-02): the agents' and the treatment client's peer names
      ORCHESTRATOR_SAFETY_AGENT_SERVICE_URL: *safety-url
      ORCHESTRATOR_THERAPY_AGENT_SERVICE_URL: *therapy-url
      ORCHESTRATOR_DIAGNOSIS_AGENT_SERVICE_URL: *diagnosis-url
      ORCHESTRATOR_PERSONALITY_AGENT_SERVICE_URL: *personality-url
      ORCHESTRATOR_ASSESSMENT_AGENT_SERVICE_URL: *diagnosis-url
      SERVICE_TREATMENT_SERVICE_URL: *therapy-url
      # Edge (MVP-225): as user-service; the ORCHESTRATOR_* names are legacy aliases of the same values.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      ORCHESTRATOR_CORS_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      TRUSTED_PROXY_HOPS: "0"
      ORCHESTRATOR_TRUSTED_PROXY_HOPS: "0"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      <<: *app-depends-on
      # IF-01 SPEC uses_redis=True: the runtime pings REDIS_URL (and its rate limiter uses it) at startup
      redis:
        condition: service_healthy
      # Peers start first when they are part of the run; the orchestrator degrades without them.
      safety-service:
        condition: service_started
        required: false
      memory-service:
        condition: service_started
        required: false
      therapy-service:
        condition: service_started
        required: false
      diagnosis-service:
        condition: service_started
        required: false
      personality-service:
        condition: service_started
        required: false
    healthcheck:
      <<: *live-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/live', timeout=3)"]
    <<: *app-service
    networks:
      - backend
      - frontend
      - data

  analytics-service:
    build:
      context: .
      dockerfile: services/analytics-service/Dockerfile
    image: solace/analytics-service:${SOLACE_IMAGE_TAG:-dev}
    environment:
      <<: [*app-env, *data-plane-env]
      # P1-9: runtime gate is ServiceConfig(env_prefix="ANALYTICS_SERVICE_").env, so the
      # binding var is ANALYTICS_SERVICE_ENV; MVP-004: derived from ENVIRONMENT.
      ANALYTICS_SERVICE_ENV: ${ENVIRONMENT:-development}
      ANALYTICS_SERVICE_PORT: 8009
      # legacy aliases (IF-02)
      CONSUMER_KAFKA_ENABLED: "true"
      CONSUMER_KAFKA_BOOTSTRAP_SERVERS: *kafka-bootstrap
    ports:
      - "127.0.0.1:8009:8009"
    depends_on:
      <<: *app-depends-on
      # IF-01 SPEC uses_redis=True: the runtime pings REDIS_URL at startup
      redis:
        condition: service_healthy
    healthcheck:
      <<: *live-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8009/live', timeout=3)"]
    <<: *app-service
    networks:
      - backend
      - data

  # config-service is not deployed in the MVP profiles (MVP-231, D-19: zero consumers, code
  # frozen under services/config_service).

  # =============================================================================
  # EDGE
  # =============================================================================

  # Caddy, the one edge in both profiles (WS-03.5, MVP-250). Dev serves plain HTTP on
  # 127.0.0.1:8088 (http://api.localhost:8088, http://auth.localhost:8088); the strict overlay
  # publishes 80/443 and pins the sites to api.<DOMAIN> and auth.<DOMAIN> (automatic HTTPS).
  # Caddy gets only its own variables. The dev BASIC_AUTH_HASH is the bcrypt hash of a random
  # password that was discarded, so no dev password opens the dashboards; every $ is escaped as $$.
  caddy:
    image: caddy:2.8-alpine
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      CADDY_ADMIN_EMAIL: ${CADDY_ADMIN_EMAIL:-dev-ops@example.invalid}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:-$$2a$$14$$/Jn6FNBQkYv/3QutdDyzjeg3AhRwCVGXSzsk.okBdnbT06rOAApZ6}
      CADDY_API_SITE: ${CADDY_API_SITE:-http://api.localhost:8088}
      CADDY_AUTH_SITE: ${CADDY_AUTH_SITE:-http://auth.localhost:8088}
    ports:
      - "127.0.0.1:8088:8088"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - frontend
      - backend
    depends_on:
      orchestrator-service:
        condition: service_started
      user-service:
        condition: service_started
    restart: unless-stopped

  # =============================================================================
  # DEVELOPMENT TOOLS
  # =============================================================================

  # DEV-ONLY debug UIs. Guarded behind the "dev" profile so they are NOT started in
  # production (REV-11). Start locally with: docker compose --profile dev up -d
  mailhog:
    image: mailhog/mailhog:v1.0.1
    profiles: ["dev"]
    ports:
      - "127.0.0.1:1025:1025"   # SMTP
      - "127.0.0.1:8025:8025"   # Web UI
    restart: unless-stopped
    networks:
      - backend

  # Kafka UI for development (dev profile only)
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2   # pinned, never :latest (MVP-045)
    profiles: ["dev"]
    environment:
      KAFKA_CLUSTERS_0_NAME: solace-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - data

# =============================================================================
# VOLUMES
# =============================================================================

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  kafka_data:
    driver: local
  zookeeper_data:
    driver: local
  zookeeper_logs:
    driver: local
  weaviate_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

# =============================================================================
# NETWORKS
# =============================================================================

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
  data:
    driver: bridge
  monitoring:
    driver: bridge
